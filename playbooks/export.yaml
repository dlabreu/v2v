---
- name: Upload VM disk to Object Store (temporary install)
  hosts: hyperv_hosts
  gather_facts: false

  vars_prompt:
      - name: vm_name
        prompt: "Enter the name of the VM to upload"
        private: no
      - name: object_store_endpoint
        prompt: "Enter Object Store endpoint URL (e.g., http://Object Store.local:9000)"
        private: no
      - name: object_store_bucket
        prompt: "Enter Object Store bucket name"
        private: no
      - name: object_store_access_key
        prompt: "Enter Object Store Access Key"
        private: yes
      - name: object_store_secret_key
        prompt: "Enter Object Store Secret Key"
        private: yes

  tasks:
      - name: Get VM disk path
        win_shell: |
            (Get-VMHardDiskDrive -VMName "{{ vm_name }}").Path
        register: vm_disk_path

      - name: Download object store client to temp location
        win_get_url:
            url: "https://dl.min.io/client/mc/release/windows-amd64/mc.exe"
            dest: "C:\\Windows\\Temp\\mc.exe"

      - name: Upload VM disk to object store
        win_shell: |
            C:\Windows\Temp\mc.exe alias set objectstore "{{ object_store_endpoint }}" "{{ object_store_access_key }}" "{{ object_store_secret_key }}" --api s3v4 --insecure
            C:\Windows\Temp\mc.exe cp --insecure "{{ vm_disk_path.stdout_lines[0] }}" objectstore/{{ object_store_bucket }}/{{ vm_name }}.vhdx

      - name: Remove object store client after upload
        win_file:
            path: "C:\\Windows\\Temp\\mc.exe"
            state: absent

      - name: Ensure downloads directory exists for disk conversion
        ansible.builtin.file:
            path: "./downloads"
            state: directory
        delegate_to: localhost

      - name: Configure object store alias
        ansible.builtin.command: >
            mc alias set objectstore {{ object_store_endpoint }} '{{ object_store_access_key }}' '{{ object_store_secret_key }}' --api s3v4 --insecure
        delegate_to: localhost

      - name: Download VM disk from object store
        ansible.builtin.command: >
            mc cp --insecure objectstore/{{ object_store_bucket }}/{{ vm_name }}.vhdx ./downloads/{{ vm_name }}.vhdx
        delegate_to: localhost
