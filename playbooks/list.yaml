---
- name: List all Hyper-V VMs and save details to a file
  hosts: hyperv_hosts
  gather_facts: false
  tasks:
      - name: Get VM details
        win_shell: |
            Get-VM | ForEach-Object {
              $vm = $_
              $cpu = $vm.ProcessorCount
              $memory = [math]::Round($vm.MemoryAssigned / 1MB, 0)
              $disks = (Get-VMHardDiskDrive -VMName $vm.Name | ForEach-Object {
                $size = (Get-VHD -Path $_.Path).Size / 1GB
                "{0:N1} GB" -f $size
              }) -join ", "
              [PSCustomObject]@{
                Name = $vm.Name
                State = $vm.State
                CPU_Count = $cpu
                Memory_MB = $memory
                Disk_Size = $disks
              }
            } | ConvertTo-Json
        register: hyperv_vms_json

      - name: Save VM info to list.txt (local)
        copy:
            dest: list.txt
            content: |
                {% for vm in hyperv_vms_json.stdout | from_json %}
                {{ vm.Name }} | State: {{ vm.State }} | CPU: {{ vm.CPU_Count }} | Memory: {{ vm.Memory_MB }} MB | Disk: {{ vm.Disk_Size }}
                {% endfor %}
        delegate_to: localhost
